<title>Gabarits DR · SIP · BR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: app chrome (switchers + palette) follows theme; the sheet is always white paper, Letter 8.5×11 proportions. */
:root{
  --bg:#F3F2F0; --fg:#1E1D1B; --muted:#6E6A64; --chrome:#FFFFFF; --line:#DAD7D1;
  --paper:#FFFFFF; --ink:#1F1F1F; --ink2:#444; --grey:#F2F2F2; --rule:#BDBDBD;
  --font-ui:"Archivo",system-ui,sans-serif; --font-doc:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  /* brand tokens, rewritten by JS from the logo */
  --brand:#E01010; --brand-dark:#A80C0C; --brand-tint:#FBE7E7; --brand-2:#E01010; --brand-band:#E01010; --brand-text:#D50F0F; --on-brand:#FFFFFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171A;--fg:#ECEAE6;--muted:#A19D96;--chrome:#222226;--line:#36363C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171A;--fg:#ECEAE6;--muted:#A19D96;--chrome:#222226;--line:#36363C;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:16px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.seg{display:flex;gap:4px;background:var(--chrome);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{font:600 13px/1 var(--font-ui);letter-spacing:.02em;padding:9px 14px;border:0;border-radius:7px;background:transparent;color:var(--fg);cursor:pointer}
.seg button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.seg button[aria-pressed="true"]{background:var(--brand-band);color:var(--on-brand)}
.pal{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.sw{display:inline-flex;align-items:center;gap:6px;background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:4px 8px 4px 4px;font-variant-numeric:tabular-nums}
.sw i{display:block;width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.08)}
.src{font-size:12px;color:var(--muted)}
.src code{font-family:ui-monospace,monospace;font-size:11px}

/* ---- sheet ---- */
.sheet{background:var(--paper);color:var(--ink);font-family:var(--font-doc);font-size:9.6pt;line-height:1.42;width:100%;max-width:816px;margin:0 auto;padding:36px 48px 32px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 12px 32px rgba(0,0,0,.14);position:relative;min-height:1000px;display:flex;flex-direction:column;gap:16px}
.sheet + .sheet{margin-top:20px}
@media (max-width:640px){.sheet{padding:22px 18px;font-size:9pt;min-height:0}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid var(--brand);padding-bottom:12px}
.hd img{height:54px;width:auto;max-width:220px;object-fit:contain;object-position:left}
.hd .t{text-align:right}
.hd .t b{display:block;font-size:14pt;letter-spacing:.06em;font-weight:700;color:var(--ink)}
.hd .t span{display:block;font-size:8.5pt;color:var(--ink2)}
.blocks{display:grid;grid-template-columns:1fr 1fr;background:var(--brand-tint);border-radius:3px;padding:12px 16px}
.blocks>div{padding-right:14px}
.blocks>div+div{border-left:1px solid var(--brand);padding-left:16px;padding-right:0}
.lbl{font-size:8pt;font-weight:700;letter-spacing:.08em;color:var(--brand-text);text-transform:uppercase;margin:0 0 4px}
.blocks p{margin:0}
@media (max-width:640px){.blocks{grid-template-columns:1fr;gap:10px}.blocks>div+div{border-left:0;border-top:1px solid var(--brand);padding:10px 0 0}}
.price{text-align:center;border-top:1.5px solid var(--brand);border-bottom:1.5px solid var(--brand);padding:10px 8px}
.price .k{font-weight:700;font-size:11pt;color:var(--brand-text);letter-spacing:.02em}
.price .v{font-weight:800;font-size:20pt;color:var(--brand-text);margin:2px 0;font-variant-numeric:tabular-nums}
.price .w{font-style:italic;color:var(--ink2)}
.price .n{font-size:7.5pt;color:var(--ink2);font-style:italic}
.band{background:var(--brand-band);color:var(--on-brand);font-weight:700;font-size:9.5pt;letter-spacing:.05em;padding:6px 10px;border-radius:2px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:var(--grey);text-align:left;font-size:8.5pt;padding:6px 8px;border-bottom:1px solid var(--rule)}
.tbl td{padding:6px 8px;vertical-align:top;border-bottom:1px solid #E6E6E6}
.tbl .n{width:28px;text-align:center;color:var(--ink2)}
.tbl .p{width:92px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;color:var(--brand-text);background:var(--brand-tint);border-bottom:0}
.tbl tfoot .p{color:var(--brand-text)}
h4{margin:0 0 4px;font-size:9.5pt;color:var(--brand-text);letter-spacing:.04em;text-transform:uppercase}
.sec ul{margin:0;padding-left:14px}
.sec li{margin:2px 0}
.sec ol{margin:0;padding-left:16px}
.sec ol li{margin:3px 0}
.sec ol li::marker{font-weight:700;color:var(--ink)}
.vol{font-style:italic;color:var(--ink2);font-size:8.8pt;margin:0}
.sig{margin-top:18px}
.sig b{display:block}
.sig span{display:block;color:var(--ink2)}
.appr{border:2px solid var(--brand);border-radius:3px;padding:12px 16px;margin-top:auto}
.appr .lbl{font-size:9.5pt;margin-bottom:8px}
.appr .r{display:grid;grid-template-columns:1.4fr 1fr;gap:8px 24px}
@media (max-width:640px){.appr .r{grid-template-columns:1fr}}
.ft{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:7.5pt;color:var(--ink2);border-top:1px solid var(--rule);padding-top:6px}
.grow{flex:1}

/* ---- lettre ---- */
.lt p{margin:0 0 9px;max-width:68ch}
.lt .meta p{margin:0}
.lt .obj{margin:12px 0}
.lt .obj b{color:var(--brand-text)}
.lt .amt{text-align:center;margin:16px 0;border-top:1px solid var(--brand);border-bottom:1px solid var(--brand);padding:8px}
.lt .amt b{display:block;font-size:14pt;color:var(--brand-text);font-variant-numeric:tabular-nums}
.lt .amt i{color:var(--ink2)}
.lt h5{margin:10px 0 4px;font-size:9.6pt;color:var(--brand-text)}
.lt ul{margin:0 0 8px;padding-left:16px}
.lt .val{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:flex-end}
</style>

<div class="wrap">
  <div class="bar">
    <div class="seg" role="group" aria-label="Entreprise">
      <button type="button" id="b-dr" data-brand="dr" aria-pressed="false">DR Électrique</button>
      <button type="button" id="b-sip" data-brand="sip" aria-pressed="false">SIP</button>
      <button type="button" id="b-br" data-brand="br" aria-pressed="true">BR Division Électricité</button>
    </div>
    <div class="seg" role="group" aria-label="Type de document">
      <button type="button" id="d-soum" data-doc="soum" aria-pressed="true">Soumission (PDF)</button>
      <button type="button" id="d-lettre" data-doc="lettre" aria-pressed="false">Format lettre</button>
    </div>
  </div>
  <div class="pal" id="pal"></div>
  <div class="src" id="src"></div>
  <div id="out"></div>
</div>

const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=r=>"#"+r.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("").toUpperCase();
const mix=(a,b,t)=>rgb2hex(hex2rgb(a).map((v,i)=>v+(hex2rgb(b)[i]-v)*t));
// Même règle que generate.py : luminance WCAG, bande et texte ajustés jusqu'à 4,5:1.
const INK="#1F1F1F";
const lum=h=>{const [r,g,b]=hex2rgb(h).map(c=>c/255).map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4);return .2126*r+.7152*g+.0722*b;};
const contrast=(a,b)=>{const la=lum(a),lb=lum(b);return (Math.max(la,lb)+.05)/(Math.min(la,lb)+.05);};
const ajuster=(src,fg,vers)=>{let h=src,t=0;while(contrast(h,fg)<4.5&&t<1){t+=.05;h=mix(src,vers,t);}return h;};
function palette(b){
  const p=b.primary, tint=mix(p,"#FFFFFF",.90);
  const white=contrast(p,"#FFFFFF")>=contrast(p,INK);
  return { brand:p, dark:mix(p,"#000000",.25), tint, brand2:b.secondary,
           band: white?ajuster(p,"#FFFFFF","#000000"):ajuster(p,INK,"#FFFFFF"), onBrand: white?"#FFFFFF":INK,
           text: ajuster(p,tint,"#000000") };
}

    <div><div class="band">TRAVAUX</div><table class="tbl"><thead><tr><th class="n">#</th><th>Description des travaux</th><th class="p">Prix</th></tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><td colspan="2">TOTAL (avant taxes)</td><td class="p">${DOC.total}</td></tr></tfoot></table></div>
    <div class="sec"><h4>Exclusions / Notes</h4><ul>${DOC.excl.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>
    <div class="sec"><div class="band">CONDITIONS</div><ol style="margin-top:6px">${DOC.cond.slice(0,3).map(l=>`<li>${esc(l)}</li>`).join("")}</ol></div>
    <div class="grow"></div>${footer(b,1)}</div>`;
  const p2=`<div class="sheet">${header(b,k)}
    <div class="sec"><ol start="4">${DOC.cond.slice(3).map(l=>`<li>${esc(l)}</li>`).join("")}</ol></div>
    <div class="sec"><h4>Volatilité des prix des matériaux</h4><p class="vol">${esc(DOC.vol)}</p></div>
    <p style="margin:8px 0 0">Nous espérons le tout à votre entière satisfaction. N'hésitez pas à communiquer avec nous pour toute information additionnelle.</p>
    <p style="margin:0">Nous vous prions d'agréer, Monsieur, nos sincères salutations.</p>
    <div class="sig"><b>${esc(s[0])}</b><span>${esc(s[1])}</span><span>${esc(s[2])}</span></div>
    <div class="appr"><p class="lbl">Approbation / Bon de commande</p><div class="r"><span>Signature : ______________________________</span><span>Date : __________________</span><span>Nom (lettres moulées) : ______________________________</span><span>Bon de commande # : __________________</span></div></div>
    ${footer(b,2)}</div>`;
  return p1+p2;
}
function lettre(k){
  const b=BRANDS[k], s=LETTRE.signer[k];
  return `<div class="sheet lt"><div class="hd"><img src="data:image/png;base64,${LOGOS[k]}" alt="${esc(b.name)}" style="height:${b.logoH}px"><div class="t"><span>${esc(b.name)}</span><span>${esc(b.addr)}</span>${b.rbq?`<span>${b.rbq}</span>`:""}</div></div>
    <p>${esc(LETTRE.lieu)}</p>
    <div class="meta">${LETTRE.attn.map(l=>`<p>${esc(l)}</p>`).join("")}</div>
    <div class="obj"><p><b>PROJET :</b> ${esc(LETTRE.projet)}</p><p><b>OBJET :</b> ${esc(LETTRE.objet)}</p></div>
    <p>Monsieur,</p>
    <p>Pour le projet mentionné en rubrique, nous avons le plaisir de vous soumettre notre prix budgétaire pour la réalisation des travaux d'électricité, établi comme suit :</p>
    <div class="amt"><b>${LETTRE.montant}</b><i>${esc(LETTRE.lettres)}</i></div>
    <h5>Soumission selon les documents suivants :</h5><ul>${LETTRE.docs.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
    <h5>Inclusions prévues dans la soumission :</h5><ul>${LETTRE.incl.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
    <h5>Exclusions :</h5><ul>${LETTRE.excl.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
    <p>En espérant le tout à votre entière satisfaction, nous vous prions d'agréer l'expression de nos meilleurs sentiments.</p>
    <div class="sig val"><div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div><i>Période de validité : 30 jours</i></div>
    <div class="grow"></div><div class="ft"><span>${esc(b.short)}${b.rbq?" · "+b.rbq:""}</span><span>Format lettre</span></div></div>`;
}

let brand="br", doc="soum";
function render(){
  const b=BRANDS[brand], p=palette(b), r=document.documentElement.style;
  r.setProperty("--brand",p.brand); r.setProperty("--brand-dark",p.dark); r.setProperty("--brand-tint",p.tint); r.setProperty("--brand-2",p.brand2);
  r.setProperty("--brand-band",p.band); r.setProperty("--on-brand",p.onBrand); r.setProperty("--brand-text",p.text);
  document.getElementById("pal").innerHTML = `<span>Palette dérivée du logo :</span>`+
    [["Primaire",p.brand],["Bande (≥ 4,5:1)",p.band],["Texte (≥ 4,5:1)",p.text],["Teinte 10 %",p.tint],["Gris clair","#F2F2F2"]].concat(b.secondary!==b.primary?[["Secondaire",b.secondary]]:[])
    .map(([n,c])=>`<span class="sw"><i style="background:${c}"></i>${n} <code>${c}</code></span>`).join("");
  document.getElementById("src").innerHTML = `Source : <code>dr-sip-br-electritek.netlify.app/assets/images/${b.src}</code>`;
  document.getElementById("out").innerHTML = doc==="soum"?soum(brand):lettre(brand);
  document.querySelectorAll("[data-brand]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.brand===brand)));
  document.querySelectorAll("[data-doc]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.doc===doc)));
}
document.querySelectorAll("[data-brand]").forEach(x=>x.addEventListener("click",()=>{brand=x.dataset.brand;render()}));
document.querySelectorAll("[data-doc]").forEach(x=>x.addEventListener("click",()=>{doc=x.dataset.doc;render()}));
try{const h=location.hash.slice(1); if(BRANDS[h]) brand=h;}catch(e){}
render();
</script>
